name: Autonomous Intelligence Fabric

on:
  schedule:
    - cron: '0 */6 * * *'        # প্রতি ৬ ঘণ্টায় রান করবে (৬ ঘণ্টা কাজ + ১ ঘণ্টা বিরতি নয় – GitHub limit)
  workflow_dispatch:              # ম্যানুয়াল রান

permissions:
  contents: write

jobs:
  run-fabric:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests duckduckgo-search onionsearch beautifulsoup4 chromadb sentence-transformers lxml trafilatura

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Run full pipeline
        run: |
          python src/discover.py
          python src/crawler.py
          python src/processor.py
          python src/embedder.py
          python src/dataset_builder.py

      - name: Commit & push changes
        run: |
          git config user.name "nobab-ai[bot]"
          git config user.email "nobab-ai[bot]@users.noreply.github.com"
          git add datasets/ chroma_db/
          git diff --staged --quiet || git commit -m "auto: update datasets $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push
