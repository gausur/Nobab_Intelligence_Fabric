name: Query Engine (Nobab AI)

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'সোর্স টাইপ (normal / darkweb / both / chromadb)'
        required: true
        default: 'both'
        type: choice
        options:
          - normal
          - darkweb
          - both
          - chromadb
      question:
        description: 'তোমার প্রশ্ন (বাংলা বা ইংরেজি)'
        required: true
        default: 'What is ransomware?'
        type: string

jobs:
  query:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Tor and dependencies
        run: |
          sudo apt update
          sudo apt install -y tor
          sudo systemctl start tor
          sudo systemctl enable tor
          sleep 5
          pip install --upgrade pip
          pip install 'requests[socks]' chromadb sentence-transformers trafilatura
      - name: Run query engine
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          python src/query_engine.py "${{ github.event.inputs.source_type }}" "${{ github.event.inputs.question }}"
