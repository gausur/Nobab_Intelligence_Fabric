name: Nobab Weekly Learner

on:
  schedule:
    # প্রতি রবিবার বাংলাদেশ সময় সকাল ৬টায় রান করবে (UTC 00:00)
    - cron: '0 0 * * 0'
      timezone: Asia/Dhaka
  workflow_dispatch:   # ম্যানুয়ালি রান করানোর অপশন

jobs:
  learn-and-assess:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # রিপোজিটরিতে ডেটা পুশ করতে পারবে
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # নির্দিষ্ট ভার্সন ইনস্টল করছে, যা পুরোপুরি সামঞ্জস্যপূর্ণ
          pip install sentence-transformers==2.2.2 transformers==4.36.0 torch chromadb
          pip install git+https://github.com/ramsrigouthamg/Questgen.ai

      - name: Run Nobab Self-Reliant Agent
        run: python nobab_self_reliant_agent.py --topic "Cybersecurity"

      - name: Run Weekly Assessment and generate report
        run: python nobab_self_reliant_agent.py --assess

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chroma_db/ datasets/
          git diff --staged --quiet || git commit -m "🤖 Auto-update learning knowledge base and datasets [skip ci]"
          git push
