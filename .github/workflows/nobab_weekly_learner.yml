name: Nobab Multi-Agent System

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  multi-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install numpy<2.0.0 chromadb==0.4.22 sentence-transformers==2.2.2 transformers==4.36.0 huggingface-hub==0.19.4 torch aiohttp beautifulsoup4 lxml aiolimiter ollama docker
          pip install langgraph langchain langchain-community
      - name: Run Nobab weekly cycle
        run: python nobab_multi_agent.py weekly
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chroma_db/ datasets/ weekly_report.md
          git diff --staged --quiet || git commit -m "🤖 Auto-update Nobab datasets and report [skip ci]"
          git push
