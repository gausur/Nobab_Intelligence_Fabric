name: Nobab Multi-Agent System

on:
  schedule:
    - cron: '0 0 * * 0'   # Every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  multi-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Nobab weekly cycle
        env:
          NOBAB_REPORT_EMAIL: ${{ secrets.NOBAB_REPORT_EMAIL }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          python nobab_multi_agent.py weekly
      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add chroma_db/ datasets/ weekly_report.md
          git diff --staged --quiet || git commit -m "🤖 Auto-update Nobab datasets and report [skip ci]"
          git push
