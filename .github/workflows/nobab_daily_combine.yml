name: Nobab Daily Combine (Old+New)
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  combine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install datasketch requests
      - name: Run advanced pipeline
        run: python nobab_advanced_pipeline.py
      - name: Commit outputs
        run: |
          git config user.name "nobab-ai[bot]"
          git add master_intel_clean.jsonl enriched_master.jsonl threats_api.json
          git diff --staged --quiet || git commit -m "🤖 auto: combined intel"
          git push
