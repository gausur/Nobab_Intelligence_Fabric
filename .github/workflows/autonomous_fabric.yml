# .github/workflows/autonomous_fabric.yml
name: Autonomous Intelligence Fabric

on:
  schedule:
    - cron: '0 */6 * * *'   # প্রতি 6 ঘন্টা পর পর রান করবে
  workflow_dispatch:         # ম্যানুয়াল রান করার অপশন

permissions:
  contents: write

jobs:
  run-fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install beautifulsoup4 chromadb lxml python-dotenv requests sentence-transformers tqdm trafilatura

      - name: Run pipeline
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE   # মূল সমাধান এখানে
          python src/discover.py
          python src/crawler.py
          python src/processor.py
          python src/embedder.py
          python src/dataset_builder.py

      - name: Commit & push
        run: |
          git config user.name "nobab-ai[bot]"
          git config user.email "nobab-ai[bot]@users.noreply.github.com"
          git add datasets/ chroma_db/
          git diff --staged --quiet || git commit -m "auto: update datasets $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push
