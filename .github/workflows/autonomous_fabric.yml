name: Autonomous Intelligence Fabric

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run full pipeline
        run: |
          export PYTHONPATH=$GITHUB_WORKSPACE
          python -m src.discover
          python -m src.crawler
          python -m src.processor
          python -m src.embedder
          python -m src.dataset_builder

      - name: Commit & push
        run: |
          git config user.name "nobab-ai[bot]"
          git config user.email "nobab-ai[bot]@users.noreply.github.com"
          git add datasets/ chroma_db/
          git diff --staged --quiet || git commit -m "auto: update datasets $(date -u '+%Y-%m-%d %H:%M:%S')"
          git push
