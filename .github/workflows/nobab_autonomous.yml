name: Nobab Autonomous Research

on:
  schedule:
    - cron: '0 */6 * * *'   # প্রতি 6 ঘণ্টায় (আপনার 5h+1h সাইকেলের জন্য)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full_research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies & Tor
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          sudo systemctl start tor

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install chromadb sentence-transformers beautifulsoup4 requests

      - name: Clone & setup DarkFox
        run: |
          git clone https://github.com/aryanguenthner/darkfox.git
          pip install -r darkfox/requirements.txt || true

      - name: Clone & setup Scraper
        run: |
          git clone https://github.com/phantomx39/Scraper.git
          pip install -r Scraper/requirements.txt || true

      - name: Clone & setup RAPTOR
        run: |
          git clone https://github.com/gadievron/raptor.git
          cd raptor && pip install -r requirements.txt && cd ..

      - name: Clone & setup PentAGI
        run: |
          git clone https://github.com/vxcontrol/pentagi.git
          cd pentagi && pip install -r requirements.txt && cd ..

      - name: Wait for Tor to be ready
        run: sleep 10

      - name: Run Nobab autonomous loop
        run: python nobab_autonomous_engine.py loop

      - name: Commit and push results
        if: always()
        run: |
          git config user.name "nobab-ai[bot]"
          git config user.email "bot@nobab.ai"
          git add chroma_db/ datasets/ weekly_research_report.md darkfox/*.json Scraper/*.json raptor/raptor_output_* pentagi/pentest_*.md
          git diff --staged --quiet || git commit -m "🤖 auto: Nobab AI research data"
          git push
