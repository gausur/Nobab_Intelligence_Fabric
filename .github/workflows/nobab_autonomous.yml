name: Nobab Autonomous Research

on:
  schedule:
    - cron: '0 */3 * * *'   # প্রতি 3 ঘণ্টায় (আপনার ইচ্ছা মতো পরিবর্তন করুন)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    continue-on-error: true   # স্ক্রিপ্ট ব্যর্থ হলেও পরের ধাপ চলবে
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install chromadb sentence-transformers beautifulsoup4 requests
      - name: Run Nobab Engine (loop)
        id: run_script
        run: |
          python nobab_autonomous_engine.py loop || echo "Script exited, but we continue"
      - name: Generate fallback report if missing
        run: |
          if [ ! -f weekly_research_report.md ]; then
            echo "# Nobab Report (Fallback)" > weekly_research_report.md
            echo "Date: $(date -u +'%Y-%m-%d %H:%M:%S')" >> weekly_research_report.md
            echo "Status: Script may have been interrupted." >> weekly_research_report.md
          fi
      - name: Commit and push
        run: |
          git config user.name "nobab-ai[bot]"
          git config user.email "bot@nobab.ai"
          git add chroma_db/ datasets/ 2>/dev/null || true
          if [ -f weekly_research_report.md ]; then git add weekly_research_report.md; fi
          git diff --staged --quiet || git commit -m "🤖 auto: Nobab research update"
          git push
