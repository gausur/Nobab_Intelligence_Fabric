name: Nobab Autonomous Research

on:
  schedule:
    # প্রতি 12 ঘণ্টায় একবার রান করবে (ব্যাকআপ)
    - cron: '0 */12 * * *'
  workflow_dispatch:   # ম্যানুয়ালি ট্রিগার

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install chromadb sentence-transformers beautifulsoup4 requests
      - name: Run Nobab Engine (loop)
        run: |
          python nobab_autonomous_engine.py loop &
          # The loop will run until GitHub kills it (max 6 hours)
          # It will automatically respect 5h work + 1h break inside the script.
          # We'll let it run in background, but better to keep foreground.
          # Actually the script will stay alive.
          # We'll monitor with timeout? Not needed.
      - name: Commit and push results (if any changes)
        if: always()
        run: |
          git config user.name "nobab-ai[bot]"
          git config user.email "bot@nobab.ai"
          git add chroma_db/ datasets/ weekly_research_report.md
          git diff --staged --quiet || git commit -m "🤖 auto: Nobab research update"
          git push
